[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taller-equipos"
version = "0.1.0"
description = "Equipment intake and dispatch tracking for an IT workshop"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyside6>=6.9",
    "PySide6-Fluent-Widgets>=1.8",
    "sqlalchemy>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "xlsxwriter>=3.2",
    "argon2-cffi>=25.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.8",
    "mypy>=1.14",
    "pyinstaller>=6.11",
    "pillow>=11",
    "nuitka>=4.3.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/taller"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Las reglas QSS son una sola cadena: cortarlas las vuelve ilegibles.
"src/taller/ui/tema.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
